name: PHP Unit Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect PHP Changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ github.event_name == 'workflow_call' || steps.filter.outputs.php == 'true' }}
    steps:
      - name: Clone repository (required for push event diff)
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect file changes
        if: github.event_name != 'workflow_call'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          token: ${{ github.token }}
          filters: |
            php:
              - 'expressionlab.php'
              - 'src/**'
              - 'tests/**'
              - 'bin/install-wp-tests.sh'
              - 'composer.json'
              - 'composer.lock'
              - 'phpunit.xml.dist'
              - 'scoper.inc.php'
              - '.github/workflows/test-php.yml'

  test-php:
    name: "PHP ${{ matrix.php }} / WP ${{ matrix.wp }}"
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            wp: '6.4'
          - php: '8.2'
            wp: 'latest'
          - php: '8.3'
            wp: 'latest'
          - php: '8.4'
            wp: 'latest'
          - php: '8.5'
            wp: 'latest'
          - php: '8.5'
            wp: 'trunk'

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, json, mysqli
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict --check-lock

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Install Subversion (SVN)
        run: sudo apt-get update -y && sudo apt-get install -y subversion

      - name: Install WordPress test suite
        run: |
          bash bin/install-wp-tests.sh \
            wordpress_test \
            root \
            root \
            127.0.0.1 \
            ${{ matrix.wp }}
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress/

      - name: Run Single-site tests
        run: vendor/bin/phpunit --exclude-group multisite

      - name: Run Multisite tests
        run: WP_MULTISITE=1 vendor/bin/phpunit --exclude-group singlesite

  test-php-status:
    name: PHP Tests
    needs: [changes, test-php]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify PHP test results
        run: |
          changes_result="${{ needs.changes.result }}"
          tests_result="${{ needs.test-php.result }}"
          echo "Changes detection status: $changes_result"
          echo "PHP tests matrix status: $tests_result"

          if [ "$changes_result" != "success" ]; then
            echo "Error: Changes detection job did not succeed."
            exit 1
          fi

          if [ "$tests_result" = "success" ] || [ "$tests_result" = "skipped" ]; then
            echo "PHP tests passed successfully or were safely skipped (no PHP changes)."
            exit 0
          else
            echo "Error: PHP tests failed."
            exit 1
          fi
