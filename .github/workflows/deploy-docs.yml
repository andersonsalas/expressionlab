name: Deploy Documentation

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-docs:
    name: Build & Deploy Docusaurus to Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      CF_PAGES_PROJECT: expressionlab-docs
      CF_PAGES_BRANCH: master

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Docusaurus
        run: pnpm --dir docs run build

      - name: Install pinned Wrangler CLI (lockfile, no install scripts)
        run: npm ci --prefix tools/wrangler --ignore-scripts --no-audit --no-fund

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          tools/wrangler/node_modules/.bin/wrangler pages deploy docs/build \
            --project-name="$CF_PAGES_PROJECT" --branch="$CF_PAGES_BRANCH"
