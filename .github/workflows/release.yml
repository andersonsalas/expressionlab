name: Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  test-php:
    name: Run PHP Tests
    uses: ./.github/workflows/test-php.yml

  test-js:
    name: Run JS Tests
    uses: ./.github/workflows/test-js.yml

  lint:
    name: Run Linters
    uses: ./.github/workflows/lint.yml

  release:
    name: Build and Publish Release
    needs: [test-php, test-js, lint]
    runs-on: ubuntu-latest
    env:
      CF_R2_BUCKET_NAME: expressionlab-updates

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, sodium
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict --check-lock

      - name: Install Composer dependencies
        run: |
          composer install --prefer-dist --no-progress --no-interaction --no-scripts
          composer bin php-scoper install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build plugin release package
        run: bash bin/build-plugin.sh
        env:
          EXPRESSION_LAB_SIGNING_KEY: ${{ secrets.EXPRESSION_LAB_SIGNING_KEY }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: build/expressionlab-*.zip
          body_path: build/RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

      - name: Upload update.json to Cloudflare R2
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put ${{ env.CF_R2_BUCKET_NAME }}/update.json --file=build/update.json --content-type=application/json --remote
