name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  test-php:
    name: Run PHP Tests
    uses: ./.github/workflows/test-php.yml

  test-js:
    name: Run JS Tests
    uses: ./.github/workflows/test-js.yml

  lint:
    name: Run Linters
    uses: ./.github/workflows/lint.yml

  release:
    name: Build and Publish Release
    needs: [test-php, test-js, lint]
    runs-on: ubuntu-latest
    env:
      CF_R2_BUCKET_NAME: expressionlab-updates
      CF_R2_PRO_BUCKET_NAME: expressionlab-pro-artifacts

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, sodium
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict --check-lock

      - name: Install Composer dependencies
        run: |
          composer install --prefer-dist --no-progress --no-interaction --no-scripts
          composer bin php-scoper install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve Pro addon build policy
        id: addon_policy
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF_NAME: ${{ github.ref_name }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$GH_REF_TYPE" != "tag" ] || ! echo "$GH_REF_NAME" | grep -qE '^v[0-9A-Za-z.+\-]+$'; then
            echo "ERROR: Releases must be triggered by a valid version tag (vX.Y.Z). Got ref_type='$GH_REF_TYPE' ref_name='$GH_REF_NAME'." >&2
            exit 1
          fi

          if [ "$GH_REPOSITORY" = "andersonsalas/expressionlab" ]; then
            if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
              echo "ERROR: Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID required to build Professional Edition." >&2
              exit 1
            fi
            echo "with_addons=true" >> "$GITHUB_OUTPUT"
            echo "addon_ref=$GH_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "Building Professional Edition with 1:1 R2 parity: addons/${GH_REF_NAME}/"
          else
            echo "External repository detected ($GH_REPOSITORY); building Community Edition without proprietary addons."
            echo "with_addons=false" >> "$GITHUB_OUTPUT"
            echo "addon_ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Pro addon bundle from Cloudflare R2
        if: steps.addon_policy.outputs.with_addons == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object get ${{ env.CF_R2_PRO_BUCKET_NAME }}/addons/${{ steps.addon_policy.outputs.addon_ref }}/addon-bundle.tar.gz --file=/tmp/addon-bundle.tar.gz --remote

      - name: Download Pro addon checksum from Cloudflare R2
        if: steps.addon_policy.outputs.with_addons == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object get ${{ env.CF_R2_PRO_BUCKET_NAME }}/addons/${{ steps.addon_policy.outputs.addon_ref }}/addon-bundle.tar.gz.sha256 --file=/tmp/addon-bundle.tar.gz.sha256 --remote

      - name: Verify and extract Pro addon bundle
        if: steps.addon_policy.outputs.with_addons == 'true'
        run: |
          (cd /tmp && sha256sum -c addon-bundle.tar.gz.sha256)
          rm -rf assets/addons
          mkdir -p assets/addons
          tar -xzf /tmp/addon-bundle.tar.gz -C assets/addons
          rm -f /tmp/addon-bundle.tar.gz /tmp/addon-bundle.tar.gz.sha256
          test -f assets/addons/addons.json
          test -f assets/addons/integrity.json
          test -f assets/addons/signature.json

      - name: Build plugin release package
        env:
          EXPRESSION_LAB_SIGNING_KEY: ${{ secrets.EXPRESSION_LAB_SIGNING_KEY }}
        run: |
          if [ "${{ steps.addon_policy.outputs.with_addons }}" = "true" ]; then
            EXPRESSION_LAB_WITH_ADDONS=1 bash bin/build-plugin.sh
          else
            bash bin/build-plugin.sh
          fi

      - name: Audit generated release package
        env:
          WITH_ADDONS: ${{ steps.addon_policy.outputs.with_addons }}
        run: |
          ZIP_COUNT=$(ls -1 build/expressionlab-*.zip | wc -l)
          if [ "$ZIP_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 release ZIP, found $ZIP_COUNT." >&2
            exit 1
          fi
          ZIP_FILE=$(ls -1 build/expressionlab-*.zip)

          if unzip -l "$ZIP_FILE" | grep -q "expressionlab/assets/addons"; then
            echo "ERROR: Security violation: assets/addons/ must not exist inside $ZIP_FILE." >&2
            exit 1
          fi

          unzip -l "$ZIP_FILE" | grep -q "expressionlab/assets/build/expressionlab-app.js"
          unzip -l "$ZIP_FILE" | grep -q "expressionlab/assets/build/expressionlab-onboard.js"
          unzip -l "$ZIP_FILE" | grep -q "expressionlab/assets/integrity.json"

          if [ "$WITH_ADDONS" = "true" ]; then
            unzip -p "$ZIP_FILE" expressionlab/expressionlab.php | grep -q "define( 'EXPRESSION_LAB_ADDON_ENABLED', true );"
          else
            unzip -p "$ZIP_FILE" expressionlab/expressionlab.php | grep -q "define( 'EXPRESSION_LAB_ADDON_ENABLED', false );"
          fi

          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("build/update.json", "utf8"));
            if (!m.version || !/^[0-9a-f]{64}$/.test(m.sha256 || "") || !/^[0-9a-f]{128}$/.test(m.signature || "")) {
              throw new Error("Invalid build/update.json manifest fields");
            }
            console.log("Audit OK:", { version: m.version, sha256: m.sha256, with_addons: process.env.WITH_ADDONS });
          '

      - name: Clean up ephemeral addon mount
        if: always()
        run: rm -rf assets/addons /tmp/addon-bundle.tar.gz /tmp/addon-bundle.tar.gz.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: build/expressionlab-*.zip
          body_path: build/RELEASE_NOTES.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

      - name: Upload update.json to Cloudflare R2
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put ${{ env.CF_R2_BUCKET_NAME }}/update.json --file=build/update.json --content-type=application/json --remote
