    <g id="layer-wordpress">
      <polygon class="iso-top-face iso-block-stroke" points="246,246 427.87,141 318.75,78 136.88,183" />
      <polygon class="iso-left-face iso-block-stroke" points="246,246 246,302 136.88,239 136.88,183" />
      <polygon class="iso-block-stroke iso-right-face-wordpress" fill="#23282d" points="246,246 427.87,141 427.87,197 246,302" />
      <g transform="matrix(0.866025, -0.5, 0, 1, 336.93, 221.5)">
        <text class="iso-text" x="0" y="0"  font-weight="600" font-size="18.5" letter-spacing="0.01em">WordPress</text>
      </g>
    </g>

    <g id="layer-expression-lab">
      <polygon class="iso-top-face iso-block-stroke" points="246,174 427.87,69 318.75,6 136.88,111" />
      <polygon class="iso-left-face iso-block-stroke" points="246,174 246,230 136.88,167 136.88,111" />
      <polygon class="iso-block-stroke iso-right-face-expression-lab" fill="#3858e9" points="246,174 427.87,69 427.87,125 246,230" />
      <g transform="matrix(0.866025, -0.5, 0, 1, 336.93, 149.5)">
        <text class="iso-text" x="0" y="0"  font-weight="600" font-size="17" letter-spacing="0.01em">Expression Lab</text>
